# Composes this repo's label set from equalizedigital/development-standards
# fragments and enforces it nightly. This repo is public, so it can't call
# development-standards' reusable workflow via `uses:` (GitHub doesn't allow
# a public repo to call a reusable workflow hosted in a private repo) — the
# steps are inlined here instead. Fragment definitions themselves stay
# 100% centralized in development-standards; only this orchestration
# wrapper is duplicated (here and in accessibility-new-window-warnings,
# the other public repo in this rollout).
#
# Requires the org-level LABEL_SYNC_TOKEN secret. dry-run is forced true on
# the schedule trigger (inputs is empty outside workflow_dispatch) so the
# nightly cron can never apply an unvalidated live sync.

name: Label Sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview changes without applying them"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out label definitions (central config repo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: equalizedigital/development-standards
          path: development-standards
          token: ${{ secrets.LABEL_SYNC_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Merge fragments into one config
        working-directory: development-standards
        run: |
          pip install pyyaml
          python3 fragments/merge.py "base,community,a11y-taxonomy,component-accessibility-checker,ci-automation" > /tmp/labels-merged.yml
          cat /tmp/labels-merged.yml

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@24d110aa46a59976b8a7f35518cb7f14f434c916 # v5.3.0
        with:
          github-token: ${{ secrets.LABEL_SYNC_TOKEN }}
          yaml-file: /tmp/labels-merged.yml
          skip-delete: false
          dry-run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run }}