on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linear-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: linear/linear-release-action@dd4fc407f860b9460d2cf0b3fb1edd8985cf443f # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
